name: HTML Project CI

on:
  push:
    branches: [ "main", "feature/test-branch" ] # Run on push to main or test-branch
  pull_request:
    branches: [ "main" ]

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Intentionally Failing Test for Branch
        run: |
          echo "Simulating a broken feature..."
          exit 1  # This forces the build to fail (turn red)