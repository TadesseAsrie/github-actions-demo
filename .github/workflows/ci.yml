name: HTML Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML File Exists (Intentionally Broken)
        run: |
          if [ -f "wrong-file.html" ]; then
            echo "File found successfully!"
          else
            echo "Error: Required file wrong-file.html is missing!"
            exit 1 # This explicitly tells GitHub Actions to fail the build
          fi