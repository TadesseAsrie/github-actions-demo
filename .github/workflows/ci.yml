name: Simple Learning Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  run-my-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Script
        run: npm test